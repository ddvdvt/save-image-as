<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Алтай летом: пять озёр за неделю</title>
  <style>
    body{margin:0;font:17px/1.6 Georgia,"Times New Roman",serif;color:#222;background:#fbfaf7}
    header{display:flex;align-items:center;justify-content:space-between;padding:14px 48px;border-bottom:1px solid #e4e0d6;font:600 15px system-ui,sans-serif}
    header b{font:700 20px Georgia,serif;letter-spacing:.02em}
    nav span{margin-left:22px;color:#666}
    main{max-width:860px;margin:0 auto;padding:26px 24px}
    .kicker{font:600 13px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#a0522d}
    h1{font-size:36px;line-height:1.15;margin:6px 0 10px}
    .meta{font:14px system-ui,sans-serif;color:#777;margin-bottom:18px}
    figure{margin:0 0 16px}
    figure img{display:block;width:100%;border-radius:6px}
    figcaption{font:13px system-ui,sans-serif;color:#777;margin-top:6px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  </style>
</head>
<body>
  <header><b>Дорожные заметки</b><nav><span>Маршруты</span><span>Снаряжение</span><span>Фото</span></nav></header>
  <main>
    <div class="kicker">Маршрут · 7 дней</div>
    <h1>Алтай летом: пять озёр за неделю</h1>
    <div class="meta">12 июля · 8 минут чтения</div>
    <figure><img id="hero" src="http://img.travel-cdn.example/photos/altai-lake.webp" alt="Озеро на рассвете" width="812" height="400"><figcaption>Озеро на рассвете, вид с перевала</figcaption></figure>
    <div class="row">
      <figure><img id="anim" src="/img/marmot.gif" alt="Сурок" width="398" height="220"><figcaption>Местный житель</figcaption></figure>
      <figure><img id="map" src="/img/route.svg" alt="Схема маршрута" width="398" height="220"><figcaption>Схема маршрута</figcaption></figure>
    </div>
    <p>Мы начали путь от посёлка у подножия хребта и за первый день поднялись к первому озеру. Вода здесь холодная даже в июле, а утром над ней стоит туман.</p>
  </main>
</body>
</html>
